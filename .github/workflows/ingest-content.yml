name: Scheduled Content Ingestion & AI Enrichment (Migrated to Vercel Cron)

# Disabled schedule because ingestion runs natively via Vercel Crons (/api/ingest-news)
# and GitHub Actions account quota has reached 100% (3000/3000 mins).
on:
  workflow_dispatch:        # Manual trigger only if needed

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Master Ingestion & AI Pipeline
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: 'production'
          SANITY_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: node scripts/ingestion/ingestAll.mjs
